<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c3e86">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MANIFEST WEATHER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;600;800&family=Lexend:wght@400;600;800&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;600;800&family=Sora:wght@400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ THEME TOKENS ============ */
:root{
  --bg-top:#0d1017; --bg-mid:#0b2442; --bg-bot:#08325c;
  --tile:#0b0f16;
  --glow:62,149,242;      /* #3e95f2 main glow */
  --deep:29,79,138;       /* #1d4f8a */
  --hi:156,200,249;       /* #9cc8f9 */
  --hot:221,234,251;      /* #ddeafb */
  --card-a:#9fd0ff; --card-b:#6aa9f5; --card-c:#4d8de6;
  --ink:#eaf3ff; --ink-dim:rgba(214,232,255,.62); --ink-faint:rgba(214,232,255,.38);
  --banner-ink:#0c1a2e; --pill:#0d1017; --avatar:#e6dcff;
  --line:rgba(156,200,249,.28);
  --danger:255,59,92; --warn:255,176,59; --ok:72,220,160;
  --r:22px;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
/* the 11 user themes (colours sampled from the reference images) */
:root{--page-top:var(--bg-top);--page-mid:var(--bg-mid);--page-bot:var(--bg-bot);--page-ink:var(--ink);--page-ink-dim:var(--ink-dim);--page-pattern:none}
[data-theme="ultraviolet"]{--bg-top:#100829;--bg-mid:#27145a;--bg-bot:#4a1eb4;--page-bot:#5028ba;--tile:#0e0724;--glow:88,44,205;--deep:39,20,90;--hi:169,139,255;--hot:238,232,255;--card-a:#c4b2ff;--card-b:#8a63f5;--card-c:#4f22c2;--line:rgba(169,139,255,.3);--avatar:#ffe3cf;--banner-ink:#12062e}
[data-theme="fog"]{--bg-top:#0b0d18;--bg-mid:#1c2d44;--bg-bot:#3d4658;--page-top:#0c101e;--page-mid:#1c2d44;--page-bot:#bcb3b2;--page-ink:#0b0d18;--page-ink-dim:rgba(11,13,24,.65);--tile:#0c111c;--glow:204,195,191;--deep:61,70,88;--hi:228,222,217;--hot:250,248,246;--card-a:#ece7e2;--card-b:#ccc3bf;--card-c:#e2874b;--line:rgba(228,222,217,.26);--avatar:#e2874b;--banner-ink:#0b0d18}
[data-theme="lavender"]{--bg-top:#06071c;--bg-mid:#100d39;--bg-bot:#261d68;--page-top:#6f6aa0;--page-mid:#5a5391;--page-bot:#454368;--tile:#06071c;--glow:86,63,216;--deep:38,29,104;--hi:162,130,255;--hot:224,221,243;--card-a:#d9d4f2;--card-b:#938dbf;--card-c:#5a5391;--line:rgba(195,189,228,.3);--avatar:#fff0d9;--banner-ink:#100d39}
[data-theme="silk"]{--bg-top:#030413;--bg-mid:#0d1034;--bg-bot:#1f0d42;--page-bot:#142553;--tile:#060c2b;--glow:214,40,170;--deep:68,12,80;--hi:103,152,230;--hot:236,232,255;--card-a:#a9c1ff;--card-b:#8c5cf0;--card-c:#d63fb0;--line:rgba(159,182,255,.3);--avatar:#ffe0f1;--banner-ink:#060c2b}
[data-theme="cobalt"]{--bg-top:#0b1290;--bg-mid:#0e1cd0;--bg-bot:#1b5af3;--page-top:#0e1cd0;--page-mid:#1c3de9;--page-bot:#336ef5;--tile:#070f6a;--glow:28,61,233;--deep:11,19,160;--hi:140,170,255;--hot:242,245,255;--card-a:#f2f4ff;--card-b:#afb9f8;--card-c:#3560ee;--line:rgba(175,185,255,.35);--avatar:#dff3ff;--banner-ink:#0b13a0}
[data-theme="acid"]{--bg-top:#080808;--bg-mid:#0f0f0f;--bg-bot:#151613;--page-top:#080808;--page-mid:#151613;--page-bot:#5f8f1c;--tile:#0a0a0a;--glow:142,216,24;--deep:59,74,35;--hi:173,226,88;--hot:228,240,209;--card-a:#f4fbe8;--card-b:#ade258;--card-c:#8ed818;--line:rgba(173,226,88,.26);--avatar:#e4f0d1;--banner-ink:#0f0f0f}
[data-theme="prism"]{--bg-top:#1b0333;--bg-mid:#180f29;--bg-bot:#3a1268;--page-top:#1b0333;--page-mid:#3a1268;--page-bot:#6c2bb5;--tile:#120a22;--glow:236,67,248;--deep:90,52,133;--hi:41,218,234;--hot:224,248,250;--card-a:#cfeff1;--card-b:#bfa9e2;--card-c:#d83de7;--line:rgba(191,169,226,.3);--avatar:#cfeff1;--banner-ink:#180f29}
[data-theme="day"]{--bg-top:#0c1118;--bg-mid:#1b324b;--bg-bot:#2b5481;--page-top:#abd2fd;--page-mid:#92c6fe;--page-bot:#62a0e3;--page-ink:#0c1118;--page-ink-dim:rgba(12,17,24,.65);--tile:#0c1118;--glow:97,167,244;--deep:43,84,129;--hi:171,210,253;--hot:216,234,253;--card-a:#1b324b;--card-b:#101a25;--card-c:#0c1118;--line:rgba(171,210,253,.26);--avatar:#e6dcff;--banner-ink:#eaf3ff;--pill:#eaf3ff}
[data-theme="day"] .pill-dark{color:#0c1118}
[data-theme="eclipse"]{--bg-top:#070102;--bg-mid:#2e0120;--bg-bot:#5a094b;--tile:#0e0108;--glow:199,45,235;--deep:116,13,88;--hi:241,91,156;--hot:255,226,205;--card-a:#f8dccf;--card-b:#f15b9c;--card-c:#b31f83;--line:rgba(241,91,156,.3);--avatar:#f8dccf;--banner-ink:#18010f}
[data-theme="ocean"]{--bg-top:#08182a;--bg-mid:#0b2a45;--bg-bot:#163f63;--page-top:#f6f7f8;--page-mid:#e8eced;--page-bot:#c2cad0;--page-ink:#163f63;--page-ink-dim:rgba(22,63,99,.68);--tile:#0b2a45;--glow:21,127,175;--deep:22,63,99;--hi:127,211,255;--hot:232,247,255;--card-a:#79b0c7;--card-b:#2775a0;--card-c:#163f63;--line:rgba(127,211,255,.28);--avatar:#e8f7ff;--banner-ink:#ffffff;--pill:#ffffff}
[data-theme="ocean"] .pill-dark{color:#163f63}
[data-theme="zone"]{--bg-top:#0e0f13;--bg-mid:#11201f;--bg-bot:#1d3926;--tile:#0d1013;--glow:53,227,172;--deep:29,57,38;--hi:188,254,1;--hot:240,255,214;--card-a:#e6ffb0;--card-b:#bcfe01;--card-c:#35e3ac;--line:rgba(188,254,1,.24);--avatar:#e6ffb0;--banner-ink:#0e0f13;
  --page-pattern:linear-gradient(rgba(188,254,1,.07) 1px,transparent 1px) 0 0/ 92px 92px,linear-gradient(90deg,rgba(188,254,1,.07) 1px,transparent 1px) 0 0/ 92px 92px}

[data-theme="crimson"]{--bg-top:#1a0103;--bg-mid:#4a050b;--bg-bot:#74070d;--page-bot:#8a0c14;--tile:#1c0204;--glow:200,19,29;--deep:116,7,13;--hi:255,112,128;--hot:255,226,228;--card-a:#ffc1c6;--card-b:#e8323f;--card-c:#9a1119;--line:rgba(255,112,128,.3);--avatar:#ffe0e2;--banner-ink:#2a0205;--danger:255,196,0}
[data-theme="frost"]{--bg-top:#0b1520;--bg-mid:#111e2b;--bg-bot:#3c4f63;--page-bot:#4a6480;--tile:#101b27;--glow:104,158,225;--deep:51,110,161;--hi:210,226,245;--hot:255,255,255;--card-a:#ffffff;--card-b:#dfe8f3;--card-c:#8fb2dc;--line:rgba(210,226,245,.3);--avatar:#eef3f8;--banner-ink:#111e2b}
[data-theme="aurora"]{--bg-top:#1a1425;--bg-mid:#24163a;--bg-bot:#3a1f55;--tile:#140f20;--glow:163,51,120;--deep:60,35,110;--hi:128,134,240;--hot:245,245,247;--card-a:#f5f5f7;--card-b:#b8b2e6;--card-c:#a33378;--line:rgba(184,178,230,.3);--avatar:#f5e6ff;--banner-ink:#1a1425}
[data-theme="limemist"]{--bg-top:#031008;--bg-mid:#0b1f12;--bg-bot:#1e2724;--page-bot:#1d2b3f;--tile:#041109;--glow:44,131,76;--deep:22,60,35;--hi:173,198,47;--hot:232,242,190;--card-a:#e6f0b8;--card-b:#adc62f;--card-c:#2c834c;--line:rgba(173,198,47,.28);--avatar:#e6f0b8;--banner-ink:#031008}
[data-theme="spectra"]{--bg-top:#050305;--bg-mid:#121113;--bg-bot:#1a1530;--tile:#0a080b;--glow:34,52,209;--deep:60,20,90;--hi:248,103,1;--hot:255,224,190;--card-a:#ffc38a;--card-b:#f86701;--card-c:#2234d1;--line:rgba(248,140,60,.3);--avatar:#ffe0c2;--banner-ink:#050305}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg-top);color:var(--ink);font-family:var(--font);font-feature-settings:"tnum" 1}
body{min-height:100vh;background:var(--page-pattern),linear-gradient(180deg,var(--page-top) 0%,var(--page-top) 12%,var(--page-mid) 62%,var(--page-bot) 100%);overflow-x:hidden;transition:background .6s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ============ SHELL ============ */
.app{max-width:1180px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.banner{position:relative;z-index:5;max-width:820px;margin:10px auto 34px;border-radius:20px;padding:18px 20px;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"av brand tools" "av meta tools";column-gap:16px;row-gap:8px;align-items:center;
  background:linear-gradient(135deg,var(--card-a) 0%,var(--card-b) 70%,var(--card-c) 100%);color:var(--banner-ink);
  box-shadow:0 20px 60px -20px rgba(var(--glow),.55), inset 0 1px 0 rgba(255,255,255,.6)}
.av{grid-area:av;position:relative;align-self:center}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--avatar);display:grid;place-items:center;font-size:30px;flex:none;position:relative;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-cursor{position:absolute;left:46px;top:42px;width:14px;height:14px;fill:var(--banner-ink)}
.banner .meta{grid-area:meta;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:13px;font-weight:600;opacity:.92}
.banner .hint{font-size:11.5px;font-weight:800;opacity:.75;animation:hintBob 2.2s ease-in-out infinite}
@keyframes hintBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.banner .tools{grid-area:tools;display:flex;gap:6px;align-self:start}
@media (max-width:640px){.banner{grid-template-areas:"av meta tools" "brand brand brand";row-gap:14px;padding:16px}.avatar{width:54px;height:54px;font-size:26px}.avatar-cursor{left:40px;top:36px}}

/* MANIFEST YOUR TIME: thick block capitals, 3D extrusion, moving shine */
.brand{grid-area:brand;margin:0;font-family:'Archivo Black','Arial Black','Helvetica Neue',sans-serif;font-weight:400;font-size:clamp(26px,4.2vw,40px);line-height:1.02;letter-spacing:.01em;text-transform:uppercase;color:var(--banner-ink);
  display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:.28em;row-gap:.06em;
  text-shadow:0 -1px 0 rgba(255,255,255,.6),0 1px 0 rgba(var(--deep),.95),0 2px 0 rgba(var(--deep),.85),0 3px 0 rgba(var(--deep),.75),0 4px 0 rgba(var(--deep),.6),0 7px 12px rgba(0,0,0,.28),0 14px 26px rgba(var(--deep),.3)}
@media (max-width:640px){.brand{font-size:clamp(30px,11.2vw,48px)}}
.shine{position:relative;display:inline-block}
.shine::after{content:attr(data-t);position:absolute;left:0;top:0;color:transparent;text-shadow:none;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%);background-size:320% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;animation:shine 5.5s ease-in-out infinite}
.rest.shine::after{animation-delay:.35s}
@keyframes shine{0%,58%{background-position:100% 0}100%{background-position:0 0}}
.mf{position:relative;z-index:2;display:inline-block;perspective:800px}
.mf.menu{z-index:60}
.mf-in{display:grid;padding:0;margin:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;text-shadow:inherit;cursor:pointer;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.34,1.4,.44,1)}
.mf-in:active{filter:brightness(1.05)}
.mf.flipped .mf-in{transform:rotateX(180deg)}
.mf-front,.mf-back{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.mf-back{transform:rotateX(180deg);display:flex;align-items:center;justify-content:center;gap:7px;padding:0 10px;border-radius:12px;overflow:hidden;white-space:nowrap;
  background:linear-gradient(160deg,#121c2c,#060a11);color:#eaf3ff;font-family:var(--font);font-size:12.5px;font-weight:800;letter-spacing:0;text-transform:none;text-shadow:none;
  box-shadow:inset 0 0 0 1px rgba(var(--hi),.5),inset 0 1px 0 rgba(255,255,255,.12),0 12px 26px -12px rgba(0,0,0,.7)}
.mf-back b{overflow:hidden;text-overflow:ellipsis;min-width:0}
.mf-back .chev{opacity:.7;transition:transform .25s}
.mf.menu .mf-back .chev{transform:rotate(180deg)}
.sw{display:inline-block;width:22px;height:22px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.mf-menu{position:absolute;left:0;top:calc(100% + 8px);min-width:max(100%,230px);max-height:min(62vh,560px);overflow-y:auto;overscroll-behavior:contain;z-index:40;padding:6px;border-radius:16px;display:flex;flex-direction:column;
  background:rgba(9,14,22,.96);border:1px solid rgba(var(--hi),.3);backdrop-filter:blur(16px);box-shadow:0 30px 60px -20px rgba(0,0,0,.8),0 0 40px -10px rgba(var(--glow),.5);
  font-family:var(--font);font-size:13.5px;letter-spacing:0;text-transform:none;text-shadow:none;color:var(--ink);line-height:1.2;
  opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top left;pointer-events:none;visibility:hidden;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1),visibility .2s}
.mf.menu .mf-menu{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.mf-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;font-weight:700;text-align:left;color:var(--ink)}
.mf-menu button:hover,.mf-menu button.on{background:rgba(var(--hi),.12)}
.mf-menu .sw{width:36px;height:24px}
.mf-menu .tick{margin-left:auto;color:rgb(var(--hi))}
.mf-menu svg.i{width:18px;height:18px;margin:0 9px}
.mf-menu hr{border:0;height:1px;background:rgba(var(--hi),.15);margin:4px 6px}
.auth h1.brand{display:block;text-align:center;color:#fff;font-size:clamp(30px,9vw,40px);text-shadow:0 1px 0 rgba(var(--deep),1),0 2px 0 rgba(var(--deep),.9),0 3px 0 rgba(var(--deep),.8),0 4px 0 rgba(var(--deep),.65),0 8px 18px rgba(var(--glow),.45)}
.pill-dark{background:var(--pill);color:#e9f2ff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;box-shadow:0 8px 18px -8px rgba(0,0,0,.6)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.28);color:var(--banner-ink);transition:transform .15s,background .2s}
.icon-btn:hover{background:rgba(255,255,255,.45)}.icon-btn:active{transform:scale(.94)}

.sos-strip{max-width:860px;margin:-14px auto 22px;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,rgba(var(--danger),.95),rgba(170,20,50,.95));color:#fff;font-weight:700;box-shadow:0 0 0 0 rgba(var(--danger),.7);animation:sosPulse 1.6s infinite}
.sos-strip button{margin-left:auto;background:rgba(255,255,255,.2);border-radius:999px;padding:7px 14px;font-weight:700;color:#fff}
@keyframes sosPulse{0%{box-shadow:0 0 0 0 rgba(var(--danger),.6)}70%{box-shadow:0 0 0 16px rgba(var(--danger),0)}100%{box-shadow:0 0 0 0 rgba(var(--danger),0)}}

/* ============ TILES ============ */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media (max-width:760px){.grid{grid-template-columns:1fr;gap:18px}}
.tile{position:relative;container-type:inline-size;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--tile);cursor:pointer;isolation:isolate;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.8), inset 0 0 0 1px rgba(var(--hi),.06);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
@media (max-width:760px){.tile{aspect-ratio:16/10}}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;transition:opacity .5s}
.tile .lbl{position:absolute;z-index:2;left:18px;top:16px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.02em;
  padding:5px 11px 5px 7px;border-radius:999px;background:rgba(10,16,26,.55);border:1px solid rgba(var(--hi),.18);backdrop-filter:blur(8px);color:var(--ink)}
.tile .lbl svg{width:15px;height:15px}
.tile .badge{position:absolute;right:16px;top:16px;z-index:2;font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(10,16,26,.6);border:1px solid rgba(var(--hi),.3);backdrop-filter:blur(8px)}
.tile .badge.red{background:rgba(var(--danger),.9);border-color:transparent;color:#fff;animation:sosPulse 1.6s infinite}

/* tile 1 · world (glow from top, three glass cards) */
.t-world::before{background:
  radial-gradient(70% 62% at 50% -8%,rgba(var(--glow),.62) 0%,rgba(var(--glow),.22) 40%,transparent 72%),
  linear-gradient(180deg,transparent 40%,rgba(var(--deep),.18))}
.t-world .clock-big{position:absolute;left:0;right:0;top:20%;text-align:center;font-size:clamp(28px,10cqw,72px);font-weight:600;letter-spacing:-.03em;
  background:linear-gradient(180deg,#fff,rgba(var(--hi),1));-webkit-background-clip:text;background-clip:text;color:transparent}
.t-world .clock-big small{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-dim);-webkit-text-fill-color:var(--ink-dim);margin-top:2px}
.t-world .cards{position:absolute;left:3.5%;right:3.5%;bottom:5%;height:44%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gcard{border-radius:10px;padding:10px 11px;color:#0c1a2e;overflow:hidden;
  background:linear-gradient(165deg,rgba(var(--hi),.98) 0%,rgba(var(--glow),.92) 55%,rgba(var(--deep),.95) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 10px 30px -10px rgba(var(--glow),.6)}
.gcard .c{font-size:11px;font-weight:700;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .t{font-size:clamp(15px,5cqw,30px);font-weight:700;letter-spacing:-.02em;color:#08182c;margin-top:2px}
.gcard .d{font-size:10px;font-weight:600;opacity:.7;margin-top:2px}
.gcard.dk{color:#eaf3ff;background:linear-gradient(165deg,rgba(var(--hi),.35),rgba(var(--deep),.55) 60%,rgba(11,15,22,.9));box-shadow:inset 0 0 0 1px rgba(var(--hi),.4)}
.gcard.dk .t{color:#fff}

/* tile 2 · alarm (bright floor glow) */
.t-alarm::before{background:
  radial-gradient(85% 75% at 50% 122%,rgba(255,255,255,1) 0%,rgba(var(--hot),.95) 12%,rgba(var(--hi),.85) 24%,rgba(var(--glow),.7) 40%,rgba(var(--deep),.35) 58%,transparent 76%),
  radial-gradient(42% 50% at 50% 34%,rgba(var(--glow),.28),transparent 70%)}
.t-alarm .next{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:8%}
.t-alarm .next .time{font-size:clamp(36px,14cqw,96px);font-weight:700;letter-spacing:-.04em;line-height:1;
  background:linear-gradient(180deg,#fff 30%,rgba(var(--hi),.9));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(var(--glow),.4)}
.t-alarm .next .sub{font-size:13px;font-weight:600;color:var(--ink-dim);margin-top:6px}
.t-alarm .arrow{position:absolute;left:50%;top:50%;width:46%;opacity:.12;transform:translate(-50%,-40%);stroke:rgba(var(--hi),1);stroke-width:1}

/* tile 3 · to-do (spotlight top-left + two panels) */
.t-todo::before{background:
  radial-gradient(42% 58% at 14% -6%,rgba(255,255,255,.98) 0%,rgba(var(--hot),.85) 14%,rgba(var(--hi),.55) 30%,rgba(var(--glow),.22) 52%,transparent 74%),
  linear-gradient(185deg,rgba(var(--deep),.25),transparent 55%)}
.t-todo .left{position:absolute;left:5%;bottom:10%;width:38%}
.t-todo .left .big{font-size:clamp(22px,7.5cqw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.t-todo .left .s{font-size:12px;color:var(--ink-dim);margin-top:6px;font-weight:600}
.t-todo .panes{position:absolute;right:4%;top:22%;bottom:10%;width:52%;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pane{border-radius:6px;padding:10px;font-size:11px;font-weight:600;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.pane.o{border:1px solid rgba(var(--hi),.55);background:rgba(8,12,20,.6)}
.pane.b{background:linear-gradient(170deg,rgba(var(--glow),.95),rgba(var(--hi),.8) 60%,rgba(var(--deep),.8));color:#08182c}
.pane .row{display:flex;gap:6px;align-items:flex-start;line-height:1.25}
.pane .row i{width:6px;height:6px;border-radius:50%;background:currentColor;margin-top:4px;flex:none;opacity:.8}
.pane .h{font-size:11.5px;font-weight:800;opacity:.9}

/* tile 4 · birthdays (glowing ring arc + giant gradient numeral) */
.t-bday::before{background:radial-gradient(90% 80% at 50% 0%,rgba(var(--glow),.35),transparent 70%)}
.t-bday .arc{position:absolute;left:50%;top:calc(66% - 104cqw);width:104cqw;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:#04080d;z-index:0;
  box-shadow:0 0 0 1.5px rgba(var(--hot),.95),0 0 18px 3px rgba(var(--hi),.85),0 0 60px 14px rgba(var(--glow),.55),0 0 140px 40px rgba(var(--deep),.45),inset 0 -26px 60px -10px rgba(var(--glow),.45)}
.t-bday .who{position:absolute;left:8%;right:8%;top:24%;text-align:center;z-index:1}
.t-bday .who .n{font-size:clamp(18px,6.4cqw,40px);font-weight:700;letter-spacing:-.02em}
.t-bday .who .s{font-size:clamp(12px,2.6cqw,15px);color:var(--ink-dim);font-weight:600;margin-top:4px}
.t-bday .num{position:absolute;left:0;right:0;bottom:-7%;text-align:center;font-size:clamp(80px,30cqw,250px);font-weight:700;letter-spacing:-.06em;line-height:.9;z-index:1;
  background:linear-gradient(90deg,rgba(var(--deep),.25) 0%,rgba(var(--glow),.9) 40%,rgba(var(--hot),.95) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-bday .num.emo{background:none;color:initial;-webkit-text-fill-color:initial;font-size:clamp(60px,18cqw,140px);bottom:4%}

/* tile 5 · notes (hourglass of light + glass card) */
.t-notes::before{background:
  radial-gradient(26% 42% at 60% -6%,rgba(255,255,255,.95),rgba(var(--hi),.6) 30%,rgba(var(--glow),.25) 60%,transparent 80%),
  radial-gradient(26% 42% at 60% 106%,rgba(255,255,255,.95),rgba(var(--hi),.6) 30%,rgba(var(--glow),.25) 60%,transparent 80%),
  radial-gradient(9% 60% at 60% 50%,rgba(var(--hi),.55),transparent 80%),
  radial-gradient(60% 60% at 0% 100%,rgba(var(--deep),.35),transparent 70%)}
.t-notes .mic{position:absolute;left:6%;top:50%;transform:translateY(-35%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:rgba(var(--hi),.14);border:1px solid rgba(var(--hi),.4);box-shadow:0 0 30px rgba(var(--glow),.45)}
.t-notes .mic svg{width:28px;height:28px}
.t-notes .card{position:absolute;right:8%;top:24%;width:46%;bottom:18%;border-radius:10px;padding:12px;
  background:linear-gradient(170deg,rgba(var(--deep),.85),rgba(18,44,69,.95));border:1px solid rgba(var(--hi),.45);box-shadow:0 0 40px rgba(var(--glow),.35)}
.t-notes .card .n{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-notes .card .p{font-size:11px;color:var(--ink-dim);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.t-notes .card .k{position:absolute;left:12px;bottom:10px;font-size:22px;font-weight:700;letter-spacing:-.02em}

/* tile 6 · wellness (diagonal light streak + outlined chips) */
.t-well::before{background:
  linear-gradient(162deg,transparent 18%,rgba(var(--deep),.35) 28%,rgba(var(--hot),.9) 38%,rgba(var(--hi),.7) 44%,rgba(var(--glow),.35) 52%,transparent 66%),
  radial-gradient(60% 50% at 90% 10%,rgba(var(--hi),.5),transparent 70%)}
.t-well .head{position:absolute;left:4%;right:4%;top:26%;text-align:center;font-size:clamp(20px,7cqw,46px);font-weight:700;letter-spacing:-.03em;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.t-well .chips{position:absolute;left:8%;right:8%;bottom:16%;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid rgba(var(--hot),.6);border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;background:rgba(var(--deep),.25);backdrop-filter:blur(6px);
  box-shadow:inset 0 0 12px rgba(var(--hi),.18)}
.chip.done{background:rgba(var(--hi),.85);color:#08182c}

/* tile 7 · medicine (banner glass, flips red on SOS) */
.t-meds::before{background:
  radial-gradient(60% 120% at 100% 0%,rgba(var(--hi),.45),transparent 60%),
  radial-gradient(50% 120% at 0% 100%,rgba(var(--glow),.45),transparent 60%),
  linear-gradient(120deg,rgba(var(--deep),.55),rgba(11,15,22,1) 60%)}
.t-meds.sos::before{background:radial-gradient(60% 120% at 100% 0%,rgba(var(--danger),.6),transparent 60%),radial-gradient(50% 120% at 0% 100%,rgba(var(--danger),.35),transparent 60%),linear-gradient(120deg,rgba(90,10,30,.8),rgba(11,15,22,1) 65%)}
.t-meds .row{position:absolute;inset:56px 18px 18px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.t-meds .row::-webkit-scrollbar{display:none}
.medchip{min-width:180px;border-radius:14px;padding:12px 14px;background:rgba(var(--hi),.08);border:1px solid rgba(var(--hi),.25)}
.medchip .n{font-weight:800;font-size:14px}.medchip .s{font-size:12px;color:var(--ink-dim);margin-top:3px}
.medchip .bar{height:5px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:10px;overflow:hidden}
.medchip .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,rgba(var(--glow),1),rgba(var(--hi),1))}
.medchip.low{border-color:rgba(var(--danger),.8);background:rgba(var(--danger),.12)}
.medchip.low .bar i{background:rgb(var(--danger))}
.empty-hint{color:var(--ink-dim);font-size:13px;font-weight:600;align-self:center}

/* footer headline */
.foot{text-align:center;margin:56px auto 10px;max-width:760px;color:var(--page-ink)}
.foot .muted{color:var(--page-ink-dim)}
.foot h2{margin:0;font-size:clamp(24px,5vw,44px);font-weight:600;letter-spacing:-.025em;line-height:1.12}
.foot .pill-light{display:inline-flex;align-items:center;gap:8px;margin-top:22px;background:#f4f8ff;color:#0d1017;border-radius:999px;padding:13px 28px;font-weight:700;font-size:15px;box-shadow:0 14px 30px -12px rgba(var(--hi),.6)}
.foot .fine{margin-top:18px;font-size:12px;color:var(--page-ink-dim)}

/* ============ SHEETS (module panels) ============ */
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg-top),var(--bg-mid) 70%,var(--bg-bot));
  transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 40% at 50% -5%,rgba(var(--glow),.4),transparent 70%)}
.sheet-head{position:relative;display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px 12px;max-width:980px;width:100%;margin:0 auto}
.sheet-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1;display:flex;align-items:center;gap:10px}
.round{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(var(--hi),.1);border:1px solid rgba(var(--hi),.2);color:var(--ink);flex:none}
.round:active{transform:scale(.94)}
.sheet-body{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(40px + env(safe-area-inset-bottom))}
.sheet-inner{max-width:980px;margin:0 auto}

.tabs{display:flex;gap:6px;padding:4px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid rgba(var(--hi),.14);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;white-space:nowrap;padding:9px 12px;border-radius:10px;font-weight:700;font-size:13px;color:var(--ink-dim)}
.tabs button.on{background:linear-gradient(165deg,rgba(var(--hi),.95),rgba(var(--glow),.9));color:#08182c}

.glass{border-radius:18px;padding:16px;background:linear-gradient(170deg,rgba(var(--hi),.07),rgba(255,255,255,.02));border:1px solid rgba(var(--hi),.16);backdrop-filter:blur(10px)}
.glass+.glass{margin-top:12px}
.glass-blue{border-radius:18px;padding:16px;background:linear-gradient(160deg,rgba(var(--hi),.95),rgba(var(--glow),.92) 55%,rgba(var(--deep),.95));color:#08182c;box-shadow:0 20px 40px -20px rgba(var(--glow),.7)}
.sec-t{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:22px 4px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:rgba(var(--hi),.06);border:1px solid rgba(var(--hi),.13)}
.item .grow{flex:1;min-width:0}
.item .t1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12.5px;color:var(--ink-dim);margin-top:2px}
.item .big{font-size:26px;font-weight:700;letter-spacing:-.03em}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.cols2{grid-template-columns:1fr}.cols3{grid-template-columns:1fr 1fr}}

/* form controls */
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--ink-dim)}
.in,select.in,textarea.in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(var(--hi),.22);background:rgba(5,10,18,.55);color:var(--ink);font-size:15px;outline:none;transition:border .2s,box-shadow .2s}
.in:focus{border-color:rgba(var(--hi),.7);box-shadow:0 0 0 3px rgba(var(--glow),.25)}
textarea.in{min-height:120px;resize:vertical;line-height:1.5}
input[type=color].in{padding:4px;height:46px}
.in::placeholder{color:var(--ink-faint)}
select.in option{background:#0b1626;color:#eaf3ff}
input[type="date"].in,input[type="time"].in,input[type="datetime-local"].in{color-scheme:dark}
.frow{display:flex;gap:10px;flex-wrap:wrap}.frow>*{flex:1;min-width:130px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:800;font-size:14px;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(165deg,rgba(var(--hot),1),rgba(var(--hi),1) 40%,rgba(var(--glow),1));color:#08182c;box-shadow:0 12px 26px -12px rgba(var(--glow),.9)}
.btn.ghost{background:rgba(var(--hi),.1);border:1px solid rgba(var(--hi),.25);color:var(--ink)}
.btn.red{background:rgb(var(--danger));color:#fff}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:11px}
.btn.wide{width:100%}
.mini{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ink-dim);flex:none}
.mini:hover{background:rgba(var(--hi),.12);color:var(--ink)}
.mini svg{width:18px;height:18px}
.toggle{position:relative;width:48px;height:28px;border-radius:99px;background:rgba(255,255,255,.14);flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.toggle.on{background:linear-gradient(90deg,rgba(var(--glow),1),rgba(var(--hi),1))}
.toggle.on::after{transform:translateX(20px)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:10px;border:1px solid rgba(var(--hi),.2);font-size:13px;font-weight:700;color:var(--ink-dim);background:rgba(5,10,18,.4)}
.seg button.on{background:rgba(var(--hi),.9);color:#08182c;border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(var(--hi),.14);color:var(--ink)}
.tag.red{background:rgba(var(--danger),.22);color:#ffb3c1}.tag.amb{background:rgba(var(--warn),.2);color:#ffd59a}.tag.grn{background:rgba(var(--ok),.18);color:#a8f5d6}
.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.small{font-size:12.5px}
.center{text-align:center}
.mt{margin-top:12px}.mt2{margin-top:20px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;display:grid;place-items:center;z-index:60;
  background:linear-gradient(165deg,rgba(var(--hot),1),rgba(var(--hi),1) 40%,rgba(var(--glow),1));color:#08182c;box-shadow:0 18px 40px -12px rgba(var(--glow),.95)}
.fab svg{width:26px;height:26px;stroke-width:2.2}

/* world clock */
.zone{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:rgba(var(--hi),.06);border:1px solid rgba(var(--hi),.13)}
.zone .flag{font-size:26px;width:36px;text-align:center}
.zone .tm{font-size:28px;font-weight:700;letter-spacing:-.03em;text-align:right}
.zone .tm small{display:block;font-size:11.5px;font-weight:600;color:var(--ink-dim);letter-spacing:0}
.zone.home{background:linear-gradient(160deg,rgba(var(--hi),.22),rgba(var(--glow),.12));border-color:rgba(var(--hi),.45)}
.dn{font-size:14px}
.ring-wrap{position:relative;width:220px;height:220px;margin:0 auto}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-wrap .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-wrap .ctr b{font-size:40px;letter-spacing:-.03em;display:block}
.chips-sel{display:flex;flex-wrap:wrap;gap:8px}
.chips-sel button{padding:9px 14px;border-radius:12px;background:rgba(var(--hi),.1);border:1px solid rgba(var(--hi),.22);font-weight:700;font-size:13px}

/* alarm presets */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.preset{position:relative;text-align:left;padding:14px;border-radius:16px;overflow:hidden;background:rgba(var(--hi),.06);border:1px solid rgba(var(--hi),.15);min-height:112px;display:flex;flex-direction:column;gap:4px}
.preset::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 80% at 100% 0%,rgba(var(--glow),.35),transparent 60%);opacity:.8;z-index:-1}
.preset .e{font-size:24px}.preset .n{font-weight:800;font-size:14px}.preset .d{font-size:11.5px;color:var(--ink-dim)}
.preset:active{transform:scale(.97)}
.alarm-time{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.days{display:flex;gap:4px}.days span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--ink-faint)}
.days span.on{background:rgba(var(--hi),.85);color:#08182c}

/* tasks */
.check{width:26px;height:26px;border-radius:9px;border:2px solid rgba(var(--hi),.5);display:grid;place-items:center;flex:none;transition:all .2s}
.check.on{background:linear-gradient(165deg,rgba(var(--hi),1),rgba(var(--glow),1));border-color:transparent;color:#08182c}
.check svg{width:15px;height:15px;stroke-width:3;opacity:0}.check.on svg{opacity:1}
.item.done .t1{text-decoration:line-through;opacity:.5}
.prio-urgent{box-shadow:inset 3px 0 0 rgb(var(--danger))}.prio-high{box-shadow:inset 3px 0 0 rgb(var(--warn))}.prio-med{box-shadow:inset 3px 0 0 rgba(var(--hi),1)}.prio-low{box-shadow:inset 3px 0 0 rgba(var(--hi),.3)}
.smart{display:flex;gap:8px}.smart .in{flex:1}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:11px;font-weight:800;color:var(--ink-faint);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:12px;background:rgba(var(--hi),.05);border:1px solid rgba(var(--hi),.08);padding:6px;display:flex;flex-direction:column;justify-content:space-between;font-weight:700;font-size:13px;text-align:left}
.cal .d.out{opacity:.3}.cal .d.today{background:linear-gradient(165deg,rgba(var(--hi),.9),rgba(var(--glow),.85));color:#08182c}
.cal .d.sel{outline:2px solid rgba(var(--hot),.9)}
.cal .d .dots{display:flex;gap:2px;flex-wrap:wrap}.cal .d .dots i{width:6px;height:6px;border-radius:50%}

/* people */
.pcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:rgba(var(--hi),.06);border:1px solid rgba(var(--hi),.13);position:relative;overflow:hidden}
.pcard .side{position:absolute;left:0;top:0;bottom:0;width:4px}
.pcard .em{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(var(--hi),.12);flex:none}
.pcard .cd{text-align:right}.pcard .cd b{font-size:24px;letter-spacing:-.03em;display:block;line-height:1}.pcard .cd span{font-size:11px;color:var(--ink-dim);font-weight:700}
.providers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prov{display:flex;align-items:center;gap:10px;padding:13px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(var(--hi),.18);font-weight:700;font-size:13.5px;text-align:left}
.prov .lg{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;flex:none}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.stickers button{font-size:30px;aspect-ratio:1;border-radius:14px;background:rgba(var(--hi),.07);border:1px solid rgba(var(--hi),.14);transition:transform .15s}
.stickers button.on{background:rgba(var(--hi),.35);border-color:rgba(var(--hot),.8);transform:scale(1.06)}
.colors{display:flex;gap:8px;flex-wrap:wrap}.colors button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.colors button.on{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.4) inset}
.wish-img{width:100%;max-width:420px;border-radius:18px;display:block;margin:0 auto;box-shadow:0 20px 50px -20px rgba(var(--glow),.8)}

/* notes */
.notes-grid{columns:2 260px;column-gap:12px}
.note{break-inside:avoid;margin-bottom:12px;padding:14px;border-radius:16px;background:rgba(var(--hi),.06);border:1px solid rgba(var(--hi),.15);cursor:pointer;position:relative}
.note .nt{font-weight:800;font-size:15px}.note .nb{font-size:13px;color:var(--ink-dim);margin-top:6px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.note .nf{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.note .pin{position:absolute;right:10px;top:10px;opacity:.8}
.micbig{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:linear-gradient(165deg,rgba(var(--hot),1),rgba(var(--hi),1) 40%,rgba(var(--glow),1));color:#08182c;box-shadow:0 0 0 0 rgba(var(--glow),.6)}
.micbig svg{width:36px;height:36px;stroke-width:2}
.micbig.rec{background:rgb(var(--danger));color:#fff;animation:sosPulse 1.2s infinite}

/* ============ RING / ALERT OVERLAY ============ */
.ring{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,12,.75);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .3s}
.ring.show{opacity:1;pointer-events:auto}
.ring-card{position:relative;width:min(440px,100%);border-radius:28px;padding:30px 24px 22px;text-align:center;overflow:hidden;background:var(--tile);box-shadow:0 40px 100px -20px rgba(var(--glow),.7)}
.ring-card::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(90% 70% at 50% 120%,rgba(255,255,255,.9),rgba(var(--hi),.8) 20%,rgba(var(--glow),.6) 40%,transparent 70%)}
.ring-card>*{position:relative;z-index:1}
.ring-card.sos{background:#1a0509;box-shadow:0 40px 100px -20px rgba(var(--danger),.9)}
.ring-card.sos::before{background:radial-gradient(90% 70% at 50% 120%,rgba(255,200,210,.9),rgba(var(--danger),.85) 25%,rgba(120,10,30,.6) 50%,transparent 75%);animation:flash 1s infinite alternate}
@keyframes flash{from{opacity:.65}to{opacity:1}}
.ring-ic{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:rgba(var(--hi),.15);border:1px solid rgba(var(--hi),.35);animation:wobble 1s infinite}
.ring-card.sos .ring-ic{background:rgba(var(--danger),.3);border-color:rgba(255,180,190,.6)}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.ring-kind{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.ring-title{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 6px}
.ring-body{font-size:15px;color:var(--ink-dim);line-height:1.45}
.ring-clock{font-size:54px;font-weight:700;letter-spacing:-.04em;margin:10px 0 4px}
.ring-acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}.ring-acts .btn{flex:1}
.ring-sticker{font-size:64px;margin:6px 0;animation:pop 1.2s infinite alternate}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.15) rotate(6deg)}}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,6,12,.6);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.show{opacity:1;pointer-events:auto}
.modal-card{width:min(560px,100%);max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0f1a2b,var(--tile));border:1px solid rgba(var(--hi),.18);transform:translateY(30px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
[data-theme="violet"] .modal-card,[data-theme="emerald"] .modal-card,[data-theme="ember"] .modal-card,[data-theme="rose"] .modal-card,[data-theme="graphite"] .modal-card{background:linear-gradient(180deg,var(--bg-mid),var(--tile))}
.modal.show .modal-card{transform:none}
@media(min-width:700px){.modal{align-items:center}.modal-card{border-radius:26px}}
.modal-card h3{margin:0 0 14px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.form{display:flex;flex-direction:column;gap:12px}
.toasts{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(420px,92vw)}
.toast{padding:12px 16px;border-radius:14px;background:rgba(14,24,40,.95);border:1px solid rgba(var(--hi),.3);font-weight:700;font-size:14px;box-shadow:0 20px 40px -10px rgba(0,0,0,.6);animation:tin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}}

/* ============ AUTH ============ */

.auth::before{content:"";position:absolute;inset:-10%;background:
  radial-gradient(40% 40% at 50% 0%,rgba(var(--glow),.55),transparent 70%),

.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.socials button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(var(--hi),.16);font-size:11.5px;font-weight:700}

/* themes */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}

/* ============ FLIP TILES + TOUCH GLOW ============ */
.tw{position:relative;aspect-ratio:16/9;perspective:1600px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
@media (max-width:760px){.tw{aspect-ratio:16/10.6}}
@media (hover:hover){.tw:hover{transform:translateY(-4px)}}
.tw:active{transform:scale(.99)}
.tw::before{content:"";position:absolute;inset:-7%;border-radius:calc(var(--r) + 18px);z-index:0;pointer-events:none;opacity:0;filter:blur(22px);
  background:radial-gradient(closest-side,rgba(var(--hot),.75),rgba(var(--hi),.55) 35%,rgba(var(--glow),.4) 62%,transparent 100%)}
.tw.lit::before,.mt-tile.lit::before{animation:bulb 1.6s ease-out}
.tw.lit .flipper>.tile,.mt-tile.lit{animation:bulbTile 1.6s ease-out}
@keyframes bulb{0%{opacity:0}10%{opacity:1}26%{opacity:.25}40%{opacity:.85}100%{opacity:0}}
@keyframes bulbTile{0%{filter:none;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}10%{filter:brightness(1.28) saturate(1.1);box-shadow:0 0 0 1.5px rgba(var(--hot),.85),0 0 46px 6px rgba(var(--glow),.75)}
  26%{filter:brightness(1.05);box-shadow:0 0 0 1px rgba(var(--hi),.4),0 0 16px rgba(var(--glow),.3)}40%{filter:brightness(1.2);box-shadow:0 0 0 1.5px rgba(var(--hot),.7),0 0 38px 4px rgba(var(--glow),.6)}100%{filter:none;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}}
.flipper{position:absolute;inset:0;z-index:1;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,1.25,.4,1)}
.tw.flipped .flipper{transform:rotateY(180deg)}
.tw.noanim .flipper{transition:none}
.flipper>.tile{position:absolute;inset:0;aspect-ratio:auto;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.tile-back{transform:rotateY(180deg);cursor:default;padding:14px 16px;display:flex;flex-direction:column;gap:6px;
  background:radial-gradient(80% 70% at 100% 120%,rgba(var(--glow),.45),transparent 70%),radial-gradient(60% 60% at 0% -10%,rgba(var(--hi),.25),transparent 70%),var(--tile)}
.tile-back::before{display:none}
.bk-head{display:flex;align-items:center;justify-content:space-between}
.lbl.static{position:static}
.tile .lbl.static{position:static}
.bk-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;scrollbar-width:thin}
.bk-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--ink)}

.bk-open{align-self:flex-end}

/* tile 8 · money (side spotlight + glass bars) */
.t-money::before{background:radial-gradient(55% 75% at 100% 110%,rgba(var(--hot),.9),rgba(var(--hi),.6) 20%,rgba(var(--glow),.4) 42%,transparent 70%),radial-gradient(50% 60% at 0% 0%,rgba(var(--deep),.45),transparent 70%)}
.t-money .mo-left{position:absolute;left:6%;top:24%;width:52%}

.mo-bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:10px;overflow:hidden}.mo-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,rgba(var(--glow),1),rgba(var(--hi),1))}

  background:radial-gradient(90% 70% at 85% -10%,rgba(var(--glow),.55),transparent 65%),radial-gradient(70% 60% at 0% 110%,rgba(var(--hi),.28),transparent 70%),var(--tile);
  box-shadow:inset 0 0 0 1px rgba(var(--hi),.12),0 20px 40px -24px rgba(0,0,0,.8);transition:transform .25s}

  background:radial-gradient(circle at 35% 30%,#ff8098,rgb(var(--danger)) 55%,#a3122f);box-shadow:0 0 0 10px rgba(var(--danger),.18),0 0 60px rgba(var(--danger),.6);animation:sosPulse 1.6s infinite}
.lg-b{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:900;flex:none}
.item.sel{border-color:rgba(var(--hi),.6);background:rgba(var(--hi),.14)}
.chip{color:var(--ink)}

/* currency converter */
.fx-hero{position:relative;padding:18px;display:flex;flex-direction:column;gap:10px}
.fx-row{display:flex;align-items:center;gap:10px}
.fx-cur{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.18);color:#08182c;text-align:left;flex:none;min-width:150px;font-weight:800}
.fx-cur small{display:block;font-size:11px;font-weight:700;opacity:.75;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-flag{font-size:26px;line-height:1}
.fx-amt,.fx-out{flex:1;min-width:0;text-align:right;font-size:clamp(24px,7vw,38px);font-weight:800;letter-spacing:-.03em;color:#08182c;background:transparent;border:0;outline:none;font-family:var(--font)}
.fx-amt{border-bottom:2px solid rgba(8,24,44,.25);padding:4px 0}
.fx-out{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-swap{align-self:flex-start;margin-left:52px;width:40px;height:40px;border-radius:50%;background:#08182c;color:#fff;font-size:18px;font-weight:900;box-shadow:0 8px 20px -8px rgba(0,0,0,.6)}
.fx-swap:active{transform:rotate(180deg)}
.fx-rate{font-size:12.5px;font-weight:700;color:rgba(8,24,44,.75)}
.fx-favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fx-fav{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:14px;background:rgba(var(--hi),.07);border:1px solid rgba(var(--hi),.15);color:var(--ink);text-align:left}
.fx-fav .v{font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* emergency numbers */
.sos-nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:8px}
.sos-num{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:16px;text-decoration:none;color:var(--ink);background:rgba(var(--danger),.12);border:1px solid rgba(var(--danger),.4)}
.sos-num b{font-size:26px;letter-spacing:-.02em;color:#fff}.sos-num span{font-size:12px;font-weight:700;color:var(--ink-dim)}
.sos-num.main{grid-column:1/-1;background:linear-gradient(135deg,rgba(var(--danger),.9),rgba(160,18,45,.9));border-color:transparent}.sos-num.main span{color:rgba(255,255,255,.85)}
.sos-num:active{transform:scale(.97)}
.fx-amt::-webkit-outer-spin-button,.fx-amt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.fx-amt{-moz-appearance:textfield;appearance:textfield}

/* ============ LAYOUT ============ */
#sky{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#wapp{position:relative;z-index:1}
body{transition:background .9s}
.app{max-width:1240px}
.wtop{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.wbrand{grid-area:auto;font-size:clamp(24px,5.6vw,40px);color:var(--page-ink);flex:1;min-width:0;
  text-shadow:0 1px 0 rgba(var(--deep),1),0 2px 0 rgba(var(--deep),.9),0 3px 0 rgba(var(--deep),.8),0 4px 0 rgba(var(--deep),.65),0 8px 22px rgba(var(--glow),.45)}
.wbrand .mf-back{background:linear-gradient(160deg,rgba(18,28,44,.92),rgba(6,10,17,.92))}
.wtools{display:flex;gap:8px}
.wbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:color-mix(in srgb,var(--tile) 55%,transparent);border:1px solid rgba(var(--hi),.25);backdrop-filter:blur(12px)}
.wbtn:active{transform:scale(.94)}
.demo-strip{margin:0 0 12px;padding:9px 14px;border-radius:14px;font-size:12.5px;font-weight:700;color:#fff;background:color-mix(in srgb,var(--tile) 60%,transparent);border:1px dashed rgba(var(--hi),.45);backdrop-filter:blur(10px)}
.demo-strip u{cursor:pointer}

/* hero carousel */
.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:30px;-webkit-overflow-scrolling:touch}
.hero::-webkit-scrollbar{display:none}
.hcard{flex:0 0 100%;scroll-snap-align:center;position:relative;padding:20px 22px 18px;border-radius:30px;min-height:360px;display:flex;flex-direction:column;gap:6px;overflow:hidden;color:#fff;isolation:isolate;
  background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 45%),color-mix(in srgb,var(--tile) var(--glass,48%),transparent);border:1px solid rgba(var(--hi),.28);backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 30px 60px -30px rgba(0,0,0,.7)}
.hcard::before{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:inherit;background:radial-gradient(70% 60% at 85% 0%,rgba(var(--glow),.45),transparent 65%),radial-gradient(60% 50% at 0% 100%,rgba(var(--hi),.18),transparent 70%)}
.hcard.lit{animation:bulbTile 1.6s ease-out}
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hc-name{font-size:clamp(20px,4.6vw,28px);font-weight:800;letter-spacing:-.02em}
.hc-top .tag{margin-left:8px;vertical-align:middle}
.hc-sub{font-size:13px;font-weight:700;opacity:.8;margin-top:2px}
.hc-home{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18)}
.hc-mid{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.hc-temp{position:relative;font-family:'Archivo Black',var(--font);font-size:clamp(84px,24vw,150px);line-height:.95;letter-spacing:-.04em;
  background:linear-gradient(180deg,#fff 30%,rgb(var(--hi)));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(var(--deep),.55)) drop-shadow(0 18px 30px rgba(var(--glow),.35))}
.hc-icon .wi{width:clamp(80px,22vw,130px);height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.hc-cond{font-size:15px;font-weight:800}
.hc-line{font-size:14px;font-weight:600;opacity:.92;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.hc-hours{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:auto;padding-top:8px}
.hc-hours div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700}
.hc-hours span{opacity:.75}
.hc-load{opacity:.7;margin:auto}
.hcard.add{display:grid;place-items:center;cursor:pointer}
.hc-add{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:54px;font-weight:300}
.hc-add span{font-size:18px;font-weight:800}.hc-add small{font-size:12px;opacity:.7;font-weight:700}
.dots{display:flex;justify-content:center;gap:7px;margin:12px 0 4px}
.dots i{width:8px;height:8px;border-radius:99px;background:color-mix(in srgb,var(--page-ink) 35%,transparent);cursor:pointer;transition:width .3s,background .3s}
.dots i.on{width:22px;background:var(--page-ink)}

/* feature shortcuts */
.wminis{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:12px 2px 6px;margin:0 -2px}
.wminis::-webkit-scrollbar{display:none}
.wm{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;width:82px;padding:12px 6px;border-radius:18px;color:#fff;position:relative;isolation:isolate;overflow:hidden;
  background:color-mix(in srgb,var(--tile) var(--glass2,52%),transparent);border:1px solid rgba(var(--hi),.22);backdrop-filter:blur(12px)}
.wm span{font-size:24px;filter:drop-shadow(0 4px 10px rgba(var(--glow),.6))}.wm b{font-size:11.5px;font-weight:800;text-align:center;line-height:1.15}
.wm::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(closest-side,rgba(var(--hot),.6),rgba(var(--glow),.35) 60%,transparent)}
.wm.lit::before{animation:bulb 1.6s ease-out}

/* tiles */
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:14px}
@media (max-width:1000px){.wgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.wgrid{gap:11px}}
.tw.wt{aspect-ratio:1}
.tw.wt.wide{grid-column:span 2;aspect-ratio:2.05}
@media (max-width:560px){.tw.wt{aspect-ratio:.8}.tw.wt.wide{aspect-ratio:1.45}.tw.wt.wide[data-tile=daily]{aspect-ratio:.98}.wt-h .lbl{font-size:11px;padding:4px 8px 4px 6px}.wt-open{width:26px;height:26px}}
.wtile{background:color-mix(in srgb,var(--tile) var(--glass2,52%),transparent);backdrop-filter:blur(16px) saturate(1.15);border:1px solid rgba(var(--hi),.2);color:#fff;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.tile-back.wtile{background:color-mix(in srgb,var(--tile) 82%,transparent)}
.wt-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.wt-h .lbl{font-size:12px;padding:5px 10px}
.wt-open{width:30px;height:30px;color:#fff;background:rgba(255,255,255,.1)}
.wt-b{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden}
.g1::before{background:radial-gradient(60% 80% at 100% 0%,rgba(var(--glow),.4),transparent 70%)}
.g2::before{background:radial-gradient(70% 70% at 0% 100%,rgba(var(--hi),.28),transparent 70%)}
.g3::before{background:radial-gradient(80% 60% at 50% 120%,rgba(var(--hot),.55),rgba(var(--glow),.35) 35%,transparent 70%)}
.g4::before{background:radial-gradient(55% 60% at 10% -10%,rgba(255,255,255,.55),rgba(var(--hi),.3) 30%,transparent 70%)}
.g5::before{background:radial-gradient(circle at 50% 55%,transparent 0 34%,rgba(var(--hi),.45) 36%,rgba(var(--glow),.2) 42%,transparent 55%)}
.g6::before{background:radial-gradient(60% 50% at 50% 0%,rgba(var(--glow),.45),transparent 70%)}
.g7::before{background:radial-gradient(70% 60% at 50% 115%,rgba(255,214,120,.6),rgba(var(--glow),.25) 40%,transparent 70%)}
.g8::before{background:radial-gradient(40% 40% at 80% 20%,rgba(230,236,255,.4),transparent 70%),radial-gradient(60% 60% at 0% 100%,rgba(var(--deep),.5),transparent 70%)}
.g9::before{background:linear-gradient(160deg,transparent 25%,rgba(var(--hot),.35) 40%,rgba(var(--glow),.2) 50%,transparent 65%)}
.g10::before{background:radial-gradient(60% 60% at 100% 100%,rgba(var(--hi),.35),transparent 70%)}
.g11::before{background:radial-gradient(70% 60% at 0% 0%,rgba(120,220,140,.32),transparent 70%)}
.g12::before{background:radial-gradient(70% 60% at 100% 0%,rgba(var(--hot),.35),transparent 70%)}
.tl2{font-size:12px;font-weight:700;opacity:.9;line-height:1.35}

/* hourly */
.hr-wrap{position:relative;overflow-x:auto;scrollbar-width:none;height:100%;min-height:140px}
.hr-wrap::-webkit-scrollbar{display:none}
.hr-svg{position:absolute;left:0;top:28px;height:60%}
.hr-row{position:relative;height:100%}
.hr-c{position:absolute;top:0;bottom:0;width:46px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:12px;font-weight:700}
.hr-c b{font-size:13px}.hr-c span{opacity:.75}.hr-c em{font-style:normal;color:#9fd8ff;font-size:10.5px;position:absolute;bottom:18px}
.hr-c .wi{margin-top:auto;margin-bottom:22px}
/* daily */
.dl{display:flex;flex-direction:column;gap:2px;overflow:auto;scrollbar-width:none}
.dl-r{display:grid;grid-template-columns:52px 30px 34px 34px 1fr 34px;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:2px 0}
.dl-p{color:#9fd8ff;font-size:11px}.dl-lo{opacity:.7;text-align:right}.dl-hi{text-align:right}
.dl-bar{position:relative;height:6px;border-radius:9px;background:rgba(255,255,255,.12)}
.dl-bar i{position:absolute;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#7fd3ff,rgb(var(--hi)),#ffb36b)}
/* rain now */
.rn-l{font-size:clamp(15px,3.6vw,19px);font-weight:800;line-height:1.2}
.rn-bars{flex:1;display:flex;align-items:flex-end;gap:4px;min-height:50px}
.rn-bars i{flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#bfe6ff,#4fb0ec)}
.rn-ax{display:flex;justify-content:space-between;font-size:10.5px;opacity:.7;font-weight:700}
/* should I */
.si{display:flex;flex-direction:column;gap:6px}
.si-r{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.si-q{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-a{font-size:11.5px;font-weight:900;padding:3px 9px;border-radius:99px;flex:none}
.si-a.yes{background:rgba(72,220,160,.25);color:#a8f5d6}.si-a.no{background:rgba(255,107,92,.22);color:#ffb3a8}.si-a.maybe{background:rgba(255,216,77,.2);color:#ffe9a0}
/* wind */
.wd{position:relative;width:min(100%,150px);margin:0 auto;aspect-ratio:1}
.wd-dial{width:100%;height:100%}
.wd-arrow{transform-origin:60px 60px;transition:transform 1.2s cubic-bezier(.3,1.4,.4,1);transform-box:view-box}
.wd-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wd-c b{font-size:26px;line-height:1}.wd-c span{font-size:11px;opacity:.75;font-weight:700}
/* air */
.aq{position:relative;width:min(100%,170px);margin:0 auto}
.aq-g{width:100%}.aq-v{position:absolute;left:0;right:0;bottom:2px;text-align:center}.aq-v b{font-size:28px;line-height:1;display:block}.aq-v span{font-size:10.5px;opacity:.75;font-weight:800}
/* sun */
.sun-arc{width:100%;max-height:90px}.sun-t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800}
/* moon */
.mn{display:flex;align-items:center;gap:12px}.mn b{font-size:15px}
.g13::before{background:radial-gradient(70% 60% at 0% 100%,rgba(255,190,120,.3),transparent 70%),radial-gradient(50% 50% at 100% 0%,rgba(var(--hi),.25),transparent 70%)}
.g14::before{background:radial-gradient(60% 60% at 85% 10%,rgba(200,190,255,.38),transparent 70%),radial-gradient(70% 60% at 0% 110%,rgba(var(--deep),.5),transparent 70%)}
/* wind hub */
.wd-hub{fill:rgba(6,10,28,.55);stroke:rgba(var(--hi),.3);stroke-width:1}
.wd-l{fill:rgba(var(--hot),.95);paint-order:stroke;stroke:rgba(6,10,28,.75);stroke-width:2.5px}
.wd-c b{font-size:22px}.wd-c span{font-size:9.5px;margin-top:1px}
/* this day last year */
.ly-head b{display:block;font-size:clamp(18px,2.1vw,24px);font-weight:800;line-height:1.1}.ly-head span{font-size:12px;font-weight:700;opacity:.75}
.ly-rows{display:flex;flex-direction:column;gap:4px}
.ly-r{display:grid;grid-template-columns:42px 24px 30px 1fr 30px;align-items:center;gap:6px;font-size:12.5px;font-weight:800}
.ly-y{opacity:.8}.ly-lo{opacity:.7;text-align:right}.ly-hi{text-align:right}
.ly-wait{display:flex;flex-direction:column;align-items:center;gap:10px}
.ly-spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:rgb(var(--hot));animation:spin 1s linear infinite}
/* sleep tonight */
.sl-top{display:flex;align-items:center;gap:11px}
.sl-ring{--p:0;--c:#fff;width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p) * 1%),rgba(255,255,255,.13) 0);position:relative}
.sl-ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:rgba(8,12,32,.82)}
.sl-ring b{position:relative;font-size:15px}
.sl-cap{min-width:0}.sl-cap b{display:block;font-size:16px;line-height:1.15}.sl-cap span{display:block;font-size:11.5px;font-weight:700;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-spark{width:100%;height:30px;flex:none}
.sl-rows{display:flex;flex-direction:column;gap:5px}
.sl-rows>div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.sl-e,.sl-k{font-style:normal}.sl-rows span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}.sl-rows b{flex:none;font-weight:800}
@media (max-width:560px){.sl-spark,.sl-e,.sl-k{display:none}.ly-r{grid-template-columns:34px 20px 26px 1fr 26px;gap:4px;font-size:11.5px}.ly-r .wi{width:20px;height:20px}.sl-rows>div{font-size:11.5px}.sl-ring{width:40px;height:40px}.sl-cap b{font-size:14px}.ly-head span{font-size:11px}}
/* key-value grid */
.bt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bt>div{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);min-width:0}
.bt span{display:block;font-size:10.5px;font-weight:800;opacity:.7;text-transform:uppercase;letter-spacing:.04em}
.bt b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.wtile{padding:11px;border-radius:18px}.bt{gap:5px}.bt>div{padding:6px 7px}.bt b{font-size:12.5px}.bt span{font-size:9.5px}.tl2{font-size:11px}}
.wsheet{min-height:200px;display:flex;flex-direction:column;gap:10px;position:relative;isolation:isolate;overflow:hidden}
.wsheet .hr-wrap{min-height:180px}
/* world */
.wworld{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ww{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:18px;background:rgba(var(--hi),.08);border:1px solid rgba(var(--hi),.16)}
.ww span{font-size:12px;opacity:.7;font-weight:700}.ww em{font-style:normal;font-size:24px;font-weight:800}
.radar{height:min(60vh,520px);border-radius:20px;overflow:hidden;background:rgba(0,0,0,.25);border:1px solid rgba(var(--hi),.2)}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.scene-b{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-radius:18px;background:rgba(var(--hi),.08);border:1px solid rgba(var(--hi),.18);color:var(--ink)}
.scene-b span{font-size:34px}.scene-b.on{background:rgba(var(--hi),.85);color:#08182c}
.widgets{display:flex;gap:12px;flex-wrap:wrap}
.wg{border-radius:24px;padding:14px;color:#fff;background:linear-gradient(160deg,rgba(var(--glow),.85),rgba(var(--deep),.95));box-shadow:0 18px 40px -18px rgba(var(--glow),.9)}
.wg.s{width:140px;height:140px;display:flex;flex-direction:column;justify-content:space-between}.wg.s b{font-size:38px;line-height:1}.wg.s span{font-size:12px;font-weight:800}
.wg.m{flex:1;min-width:260px;max-width:340px;height:140px;display:flex;flex-direction:column;justify-content:space-between}.wg.m b{font-size:34px;line-height:1;margin-right:8px}.wg.m span{font-size:12px;font-weight:800}
.wg-h{display:flex;justify-content:space-between}.wg-h i{font-style:normal;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800}
/* animated icons */
.wi-sun{transform-origin:32px 32px;animation:spin 22s linear infinite}
.wi-cloud{animation:drift 6s ease-in-out infinite alternate}
.wi-rain line{animation:fall 1.1s linear infinite}
.wi-snow circle{animation:flake 2.4s linear infinite}
.wi-bolt{animation:boltf 2.6s infinite}
.wi-fog line{animation:drift 4s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-2px)}to{transform:translateX(3px)}}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(6px);opacity:0}}
@keyframes flake{0%{transform:translate(0,-8px);opacity:0}30%{opacity:1}100%{transform:translate(3px,8px);opacity:0}}
@keyframes boltf{0%,82%,100%{opacity:.25}85%,90%{opacity:1}}
.wfoot{margin-top:40px}.wfoot a{color:inherit}
.sheet{background:linear-gradient(180deg,var(--bg-top),var(--bg-mid) 70%,var(--bg-bot))}
@media (prefers-reduced-motion:reduce){.wi-sun,.wi-cloud,.wi-rain line,.wi-snow circle,.wi-bolt{animation:none}}
@media (min-width:561px){.tw.wt.wide[data-tile=daily]{aspect-ratio:1.55}}

[data-theme="day"] .wbrand,[data-theme="ocean"] .wbrand,[data-theme="w-snow"] .wbrand{text-shadow:0 1px 0 rgba(255,255,255,.6),0 2px 0 rgba(var(--hi),.7),0 6px 16px rgba(var(--deep),.35)}
[data-theme="day"] .wbtn,[data-theme="ocean"] .wbtn,[data-theme="w-snow"] .wbtn,[data-theme="day"] .demo-strip,[data-theme="ocean"] .demo-strip,[data-theme="w-snow"] .demo-strip{background:color-mix(in srgb,var(--tile) 80%,transparent)}

.tg-h{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:12px 2px 8px}

/* ---------- place finder ---------- */
.fd-box{display:flex;align-items:center;gap:10px;padding:0 12px;height:52px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(var(--hi),.45);box-shadow:0 0 0 4px rgba(var(--hi),.08)}
.fd-box svg{width:20px;height:20px;flex:none;opacity:.8}

.fd-box input::placeholder{color:var(--ink-dim);font-weight:500}
.fd-x{border:0;background:rgba(255,255,255,.1);color:var(--ink);width:28px;height:28px;border-radius:50%;cursor:pointer;flex:none}

.fd-r,.fd-area{width:100%;text-align:left;cursor:pointer}
.fd-f{font-size:22px;width:30px;text-align:center;flex:none}

.fd-area{background:rgba(var(--hi),.12)!important;border-color:rgba(var(--hi),.45)!important}
.fd-go{font-size:22px;color:var(--ink-dim)}
.fd-h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);margin:10px 2px 6px}
.fd-states{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fd-st{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:11px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;cursor:pointer}
.fd-st b{font-size:13.5px;line-height:1.25}.fd-st span{font-size:11.5px;color:var(--ink-dim)}

S.opts.bed ??= 22; S.opts.wake ??= 7;
const aqiCat = (v, std) => std === 'eu' ? (v <= 20 ? ['Good', '#48dca0'] : v <= 40 ? ['Fair', '#a5e05a'] : v <= 60 ? ['Moderate', '#ffd84d'] : v <= 80 ? ['Poor', '#ffb03b'] : v <= 100 ? ['Very poor', '#ff6b5c'] : ['Extremely poor', '#b03a8c'])
  : (v <= 50 ? ['Good', '#48dca0'] : v <= 100 ? ['Moderate', '#ffd84d'] : v <= 150 ? ['Unhealthy for sensitive groups', '#ffb03b'] : v <= 200 ? ['Unhealthy', '#ff6b5c'] : v <= 300 ? ['Very unhealthy', '#b03a8c'] : ['Hazardous', '#7e0023']);

const burnMin = (uv, skin) => uv < .5 ? Infinity : Math.round(SKIN[skin - 1][2] / (uv * .025 * 60));
const pavement = h => h.temperature_2m + (h.is_day ? 30 * (1 - (h.cloud_cover || 0) / 100) * Math.min(1, (h.uv_index || 0) / 6 + .25) : 0);
const pollenKeys = [['grass_pollen', 'Grass'], ['birch_pollen', 'Birch'], ['alder_pollen', 'Alder'], ['ragweed_pollen', 'Ragweed'], ['mugwort_pollen', 'Mugwort'], ['olive_pollen', 'Olive']];
const pollenLvl = v => v == null ? null : v < 10 ? ['Low', '#48dca0'] : v < 50 ? ['Moderate', '#ffd84d'] : v < 200 ? ['High', '#ffb03b'] : ['Very high', '#ff6b5c'];


/* ---------- "This day last year" ---------- */
const LastYear = {
  pend: {}, fail: {},
  when(d) { let s = ''; try { s = new Intl.DateTimeFormat('en-CA', { timeZone: d.timezone, year: 'numeric', month: '2-digit', day: '2-digit' }).format(Date.now()); } catch { }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) { const n = new Date(); s = `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; }
    let [y, m, dd] = s.split('-').map(Number); y -= 1; if (m === 2 && dd === 29) dd = 28;
    return { year: y, ymd: `${y}-${pad(m)}-${pad(dd)}`, label: fmtDay(Date.UTC(y, m - 1, dd, 12), 'UTC', { day: 'numeric', month: 'short', year: 'numeric' }) }; },
  get(d, l) { const w = this.when(d), k = l.id + w.ymd, r = S.mem[k];
    if (r) return r.temperature_2m_max?.[0] != null ? { state: 'ok', r, ...w } : { state: 'none', ...w };
    if (this.fail[k] && Date.now() - this.fail[k] < 5 * MIN) return { state: 'fail', ...w };
    if (!this.pend[k]) { this.pend[k] = 1; Data.archive(l, w.ymd).catch(() => { this.fail[k] = Date.now(); }).finally(() => { delete this.pend[k]; Home.paintTiles(); if (Router.cur === 'lastyear') Router.render(); }); }
    return { state: 'wait', ...w }; },
};

/* ---------- "Sleep tonight" ---------- */
const Sleep = {

  inNight(hr) { const b = +(S.opts.bed ?? 22), w = +(S.opts.wake ?? 7); return b > w ? (hr >= b || hr < w) : (hr >= b && hr < w); },
  nights(d, n = 1) { const tz = d.timezone, H = hours(d, null, 24 * (n + 1) + 2), out = []; let cur = null;
    for (const h of H) { if (h.temperature_2m == null) break; if (this.inNight(tzHour(h.t, tz))) (cur ??= []).push(h); else if (cur) { out.push(cur); cur = null; } }

    return out.slice(0, n); },
  // 5 AC · 4 fan · 3 fan on low · 2 nothing needed · 1 light blanket · 0 heavy blanket

    return f >= 31 || (f >= 28 && dp >= 22) ? 5 : f >= 26 || (f >= 24 && dp >= 20) ? 4 : f >= 22 ? 3 : f >= 15 ? 2 : f >= 7 ? 1 : 0; },
  levelName: ['2 blankets', 'Blanket', 'Comfy', 'Fan low', 'Fan', 'AC'],
  score(W, aqi) { let p = 0;
    for (const h of W) { const f = h.apparent_temperature, dp = h.dew_point_2m ?? 10;
      p += Math.max(0, f - 22) * 5 + Math.max(0, 14 - f) * 2.5 + Math.max(0, dp - 18) * 2.5 + (h.precipitation_probability >= 50 ? 4 : 0) + ([95, 96, 99].includes(h.weather_code) ? 18 : 0) + Math.max(0, (h.wind_gusts_10m || 0) - 45) * .6; }
    p /= W.length; if (aqi != null) p += Math.max(0, aqi - 100) * .08;
    return Math.round(clamp(100 - p, 0, 100)); },
  grade: s => s >= 80 ? ['Great', '#a8f5d6'] : s >= 60 ? ['Good', '#9fd8ff'] : s >= 40 ? ['So-so', '#ffe39a'] : ['Rough', '#ffb3a8'],
  advice(W, tz) { const L = W.map(h => this.level(h)), b = L[0], minF = Math.min(...W.map(h => h.apparent_temperature));
    if (b >= 4) { const name = b === 5 ? 'AC' : 'Fan', off = L.findIndex(v => v < b); return { e: b === 5 ? '❄️' : '🌀', label: 'Fan / AC', text: off > 0 ? `${name} till ${this.hs(W[off].t, tz)}` : `${name} all night` }; }
    if (b === 3) return { e: '🌀', label: 'Fan / AC', text: L.some(v => v <= 2) ? 'Fan low, then off' : 'Fan on low' };
    if (b === 2) return L.some(v => v <= 1) ? { e: '🧣', label: 'Bedding', text: 'Light blanket' } : { e: '🌀', label: 'Fan / AC', text: 'Not needed' };
    return { e: '🧣', label: 'Bedding', text: minF < 7 ? 'Heavy blanket' : 'Light blanket' }; },
  windows(W, aqi) { const f = W[0].apparent_temperature;

/* ---------- option controls on tile backs and settings ---------- */
const getP = p => p.split('.').reduce((o, k) => o?.[k], S);
const setP = (p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((o, k) => (o[k] = o[k] ?? {}), S)[last] = v; };
const optSel = (path, label, opts) => `<label class="bk-row"><span>${label}</span><select class="in" data-change="opt" data-path="${path}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(getP(path)) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
const optTog = (path, label) => `<div class="bk-row"><span>${label}</span><button class="toggle ${getP(path) ? 'on' : ''}" data-act="optTog" data-path="${path}"></button></div>`;
const optNum = (path, label, min, max, step = 1) => `<label class="bk-row"><span>${label}</span><input class="in" type="number" min="${min}" max="${max}" step="${step}" value="${getP(path) ?? ''}" data-change="opt" data-path="${path}" data-num="1"></label>`;
Changes.opt = el => { let v = el.value; if (el.dataset.num || typeof getP(el.dataset.path) === 'number') v = +v; setP(el.dataset.path, v); save(); App.refresh(); };
Acts.optTog = el => { const p = el.dataset.path; setP(p, !getP(p)); save(); App.refresh(); };

    const rainSoon = H.slice(0, 12).some(h => h.precipitation_probability >= 45 || h.precipitation >= .5);
    const dryDay = H.slice(0, 8).filter(h => h.is_day).every(h => h.precipitation_probability < 30) && H[0].relative_humidity_2m < 80;
    const ev = H.filter(h => { const hr = tzHour(h.t, tz); return hr >= 17 && hr <= 21 && h.t < Date.now() + 24 * HOUR; });
    const walkOk = ev.filter(h => h.apparent_temperature >= 8 && h.apparent_temperature <= 32 && h.precipitation_probability < 30);

function smartLine(d, l) {
  const al = Alerts.list(d, l).filter(a => a.t < Date.now() + 6 * HOUR)[0]; if (al) return '⚠️ ' + al.title;

  if (rainH) return `Rain likely around ${fmtTime(rainH.t, d.timezone)}. Carry an umbrella.`;
  if (c.apparent_temperature >= 38) return 'Very hot. Stay in the shade and drink water.';
  if (c.apparent_temperature <= 0) return 'Freezing out there. Wear warm layers.';
  const uv = Math.max(...H.map(h => h.uv_index || 0)); if (uv >= 7) return `Strong sun today (UV ${uv.toFixed(0)}). Sunscreen on.`;

  return c.is_day ? 'A good day to be outside.' : 'A calm night ahead.';
}

const ACTS_PRESET = [['🚶', 'Walk', 1, 'any', 'mild'], ['🏃', 'Run', 1, 'morning', 'cool'], ['👕', 'Laundry drying', 4, 'any', 'dry'], ['🧺', 'Picnic', 2, 'afternoon', 'mild'], ['🚴', 'Cycling', 2, 'any', 'calm'], ['🌱', 'Gardening', 1, 'evening', 'mild'], ['📸', 'Photo walk', 1, 'evening', 'dry'], ['🛝', 'Kids at the park', 2, 'afternoon', 'mild']];
function bestSlot(d, p) {
  const H = hours(d, null, 72), tz = d.timezone; let best = null;
  for (let i = 0; i + p.dur <= H.length; i++) { const w = H.slice(i, i + p.dur); const hr = tzHour(w[0].t, tz);
    if (hr < 6 || hr + p.dur > 22) continue; if (p.part === 'morning' && hr >= 12) continue; if (p.part === 'afternoon' && (hr < 12 || hr >= 17)) continue; if (p.part === 'evening' && hr < 16) continue;
    let s = 100; w.forEach(h => { s -= h.precipitation_probability * .8; s -= Math.abs(h.apparent_temperature - (p.need === 'cool' ? 16 : 22)) * 2.2; if (p.need === 'calm') s -= Math.max(0, h.wind_speed_10m - 15) * 1.5; if (h.uv_index > 7) s -= 8; });
    s = s / 1 - (w[0].t - Date.now()) / HOUR * .15; if (!best || s > best.s) best = { s, t: w[0].t, w };
  } return best;
}
