/* =====================================================================
   PLACES: a built-in database of ~16,800 places (GeoNames, CC BY 4.0).
   Every Indian state and union territory with its cities, towns and
   district towns, plus every world city over 50,000 people and every
   capital. Search works offline, ignores accents and spaces, knows old
   and short names (Gurgaon, Bombay, Allahabad), finds towns by district,
   and forgives small typos. Weather is then pulled live for the exact
   coordinates.
   ===================================================================== */
// well-known places that share a name with a bigger one
const FAMOUS = { manali: 'Himachal Pradesh', ooty: 'Tamil Nadu', kasauli: 'Himachal Pradesh', almora: 'Uttarakhand', dharamsala: 'Himachal Pradesh' };
const Places = {
  rows: null, a1: [], dist: [], alias: [],
  key: s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''),
  words: s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean),
  regionName: (() => { try { const dn = new Intl.DisplayNames(['en'], { type: 'region' }); return cc => { try { return dn.of(cc); } catch { return cc; } }; } catch { return cc => cc; } })(),
  flag: cc => cc && cc.length === 2 ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : '📍',
  load() {
    if (this.rows) return true;
    const el = document.getElementById('placesDB'); if (!el) return false;
    const lines = el.textContent.trim().split('\n'); let mode = '';
    const rows = [];
    for (const ln of lines) {
      if (ln === 'A1' || ln === 'D' || ln === 'AL' || ln === 'R') { mode = ln; continue; }
      if (mode === 'A1') { const [cc, n] = ln.split('|'); this.a1.push({ cc, n, k: this.key(n) }); }
      else if (mode === 'D') this.dist.push({ n: ln, k: this.key(ln) });
      else if (mode === 'AL') { const [a, t, cc] = ln.split('|'); this.alias.push({ k: this.key(a), t: this.key(t), cc }); }
      else if (mode === 'R') {
        const [n, cc, a, d, la, lo, p] = ln.split('|');
        rows.push({ n, cc, a: a === '' ? -1 : +a, d: d === '' ? -1 : +d, lat: +la, lon: +lo, p: +p || 0, k: this.key(n), w: this.words(n) });
      }
    }
    this.rows = rows;
    // country names, for "Japan" style searches
    this.countries = [...new Set(rows.map(r => r.cc))].map(cc => ({ cc, n: this.regionName(cc), k: this.key(this.regionName(cc)) }));
    return true;
  },
  state(r) { return r.a >= 0 ? this.a1[r.a].n : ''; },
  district(r) { return r.d >= 0 ? this.dist[r.d].n : ''; },
  sub(r) {
    const st = this.state(r), di = this.district(r);
    if (r.cc === 'IN') return [di && this.key(di) !== r.k ? di + ' district' : '', st].filter(Boolean).join(', ');
    return [st && this.key(st) !== r.k ? st : '', this.regionName(r.cc)].filter(Boolean).join(', ');
  },
  place(r) { return { name: r.n, country: this.regionName(r.cc), cc: r.cc, region: this.state(r), lat: r.lat, lon: r.lon }; },
  homeCC() { const h = S.locs[0]; if (h?.cc) return h.cc; try { const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; if (/Calcutta|Kolkata/.test(tz)) return 'IN'; } catch { } return ''; },
  // edit distance, capped (stops early once over the limit)
  dist2(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) { const cur = [i]; let best = i;
      for (let j = 1; j <= b.length; j++) { cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (cur[j] < best) best = cur[j]; }
      if (best > max) return max + 1; prev = cur; }
    return prev[b.length];
  },
  search(query, limit = 14) {
    if (!this.load()) return { places: [], areas: [] };
    const [namePart, ...ctxParts] = query.split(','); const ctx = this.key(ctxParts.join(' '));
    let q = this.key(namePart); if (q.length < 2) return { places: [], areas: [] };
    const home = this.homeCC(), al = this.alias.filter(a => a.k === q || (q.length >= 3 && a.k.startsWith(q)));
    const scored = [];
    const ctxOk = r => !ctx || this.key(this.state(r)).startsWith(ctx) || this.key(this.district(r)).startsWith(ctx) || this.key(this.regionName(r.cc)).startsWith(ctx) || r.cc.toLowerCase() === ctx;
    for (const r of this.rows) {
      let s = 0;
      if (r.k === q) s = 1000; else if (r.k.startsWith(q)) s = 600;
      else if (r.w.some(w => w.startsWith(q))) s = 450;
      else if (q.length >= 4 && r.k.includes(q)) s = 250;
      for (const a of al) if (r.cc === a.cc && r.k === a.t) s = Math.max(s, a.k === q ? 950 : 550);
      if (r.d >= 0) { const dk = this.dist[r.d].k; if (dk === q) s = Math.max(s, r.k === dk || r.k.startsWith(dk) ? 900 : 320); else if (q.length >= 4 && dk.startsWith(q)) s = Math.max(s, 200); }
      if (!s || !ctxOk(r)) continue;
      s += Math.log10(r.p + 1) * 45 + (r.cc === home ? 70 : 0) + (FAMOUS[r.k] && FAMOUS[r.k] === this.state(r) ? 260 : 0);
      scored.push([s, r]);
    }
    // nothing close? allow small typos ("Jhansee", "Gwaliar", "Lukhnow")
    if (scored.length < 3 && q.length >= 4) {
      const max = q.length >= 7 ? 2 : 1;
      for (const r of this.rows) { if (!ctxOk(r)) continue; const d1 = this.dist2(q, r.k, max), d2 = r.k.length > q.length ? this.dist2(q, r.k.slice(0, q.length), max) : 9, d = Math.min(d1, d2 + .5);
        if (d <= max && !scored.some(x => x[1] === r)) scored.push([300 - d * 80 + Math.log10(r.p + 1) * 45 + (r.cc === home ? 70 : 0), r]); }
    }
    scored.sort((a, b) => b[0] - a[0]);
    // whole states and countries you can open as a list
    const areas = [];
    if (!ctx) {
      this.a1.forEach((s, i) => { if (s.k === q || (q.length >= 3 && s.cc === home && s.k.startsWith(q))) areas.push({ kind: 'state', i, n: s.n, cc: s.cc }); });
      this.countries.forEach(c => { if (c.k === q || (q.length >= 3 && c.k.startsWith(q))) areas.push({ kind: 'country', cc: c.cc, n: c.n }); });
      areas.sort((a, b) => (b.cc === home) - (a.cc === home) || (a.kind === 'country') - (b.kind === 'country'));
    }
    return { places: scored.slice(0, limit).map(x => x[1]), areas: areas.slice(0, 4) };
  },
  nearest(lat, lon) {
    if (!this.load()) return null; let best = null, bd = 1e9; const c = Math.cos(lat * Math.PI / 180);
    // closest place, nudged toward real towns over tiny neighbourhoods
    for (const r of this.rows) { const dx = (r.lon - lon) * c, dy = r.lat - lat, km = Math.sqrt(dx * dx + dy * dy) * 111, d = km - Math.min(4, Math.log10(r.p + 1) * 1.6); if (d < bd) { bd = d; best = r; } }
    if (!best) return null; const km = Math.hypot((best.lon - lon) * c, best.lat - lat) * 111; return km < 40 ? best : null;
  },
  states(cc = 'IN') { this.load(); const n = {}; this.rows.forEach(r => { if (r.cc === cc && r.a >= 0) n[r.a] = (n[r.a] || 0) + 1; }); return Object.entries(n).map(([i, c]) => ({ i: +i, n: this.a1[+i].n, c })).sort((a, b) => a.n.localeCompare(b.n)); },
  inState(i) { this.load(); return this.rows.filter(r => r.a === i).sort((a, b) => b.p - a.p || a.n.localeCompare(b.n)); },
  inCountry(cc) { this.load(); return this.rows.filter(r => r.cc === cc).sort((a, b) => b.p - a.p).slice(0, 300); },
  get count() { this.load(); return this.rows ? this.rows.length : 0; },
};

/* ---------- the finder: one box for every way of picking a place ---------- */
const Finder = {
  done: null, list: [],
  row(r, i) { return `<button class="item fd-r" data-fi="${i}"><span class="fd-f">${Places.flag(r.cc)}</span><div class="grow"><div class="t1">${esc(r.n)}</div><div class="t2">${esc(Places.sub(r))}</div></div>${r.p >= 1 ? `<span class="fd-p">${r.p >= 1000 ? (r.p / 1000).toFixed(1).replace(/\.0$/, '') + 'M' : r.p + 'k'}</span>` : ''}</button>`; },
  paint(c, html) { $('#fdl', c).innerHTML = html; $('#fdl', c).scrollTop = 0; },
  show(c, rows, head = '') { this.list = rows; this.paint(c, head + (rows.map((r, i) => this.row(r, i)).join('') || '')); },
  run(c, q) {
    if (q.trim().length < 2) return this.home(c);
    const { places, areas } = Places.search(q);
    const areaHtml = areas.map(a => `<button class="item fd-area" data-${a.kind === 'state' ? 'st' : 'cc'}="${a.kind === 'state' ? a.i : a.cc}"><span class="fd-f">${Places.flag(a.cc)}</span><div class="grow"><div class="t1">${esc(a.n)}</div><div class="t2">${a.kind === 'state' ? `All places in this ${a.cc === 'IN' ? 'state' : 'region'}` : 'Biggest cities in this country'}</div></div><span class="fd-go">›</span></button>`).join('');
    this.show(c, places, areaHtml);
    if (!places.length && !areas.length) this.paint(c, `<div class="fd-empty"><b>No match for “${esc(q)}”.</b><br>Try the district or a nearby town, or add the state after a comma, like “Bhimtal, Uttarakhand”.</div>${isArtifactHost ? '' : `<button class="btn ghost wide mt" data-fd="online">${ic('globe')} Search online for “${esc(q)}”</button>`}`);
    else if (!isArtifactHost) $('#fdl', c).insertAdjacentHTML('beforeend', `<button class="btn ghost wide mt fd-online" data-fd="online">${ic('globe')} Not here? Search online</button>`);
  },
  home(c) {
    const pop = ['Delhi', 'Mumbai', 'Bengaluru', 'Kolkata', 'Chennai', 'Hyderabad', 'Lucknow', 'Jaipur'];
    Places.load();
    const picks = pop.map(n => Places.rows.find(r => r.cc === 'IN' && r.k === Places.key(n))).filter(Boolean);
    this.show(c, picks, `<div class="fd-h">Popular in India</div>`);
  },
  states(c, cc = 'IN') {
    const st = Places.states(cc);
    this.paint(c, `<div class="fd-h">${cc === 'IN' ? `India · ${st.length} states and union territories` : esc(Places.regionName(cc))}</div><div class="fd-states">${st.map(s => `<button class="fd-st" data-st="${s.i}"><b>${esc(s.n)}</b><span>${s.c} places</span></button>`).join('')}</div>`);
  },
  state(c, i) {
    const rows = Places.inState(i), s = Places.a1[i];
    this.show(c, rows, `<button class="fd-back" data-fd="states" data-cc="${s.cc}">‹ All ${s.cc === 'IN' ? 'states' : 'regions'}</button><div class="fd-h">${esc(s.n)} · ${rows.length} places, biggest first</div><input class="in fd-filter" placeholder="Filter ${esc(s.n)}…" autocomplete="off">`);
    const f = $('.fd-filter', c); f.oninput = () => { const k = Places.key(f.value); $$('.fd-r', c).forEach(b => { const r = this.list[+b.dataset.fi]; b.style.display = !k || r.k.includes(k) || (r.d >= 0 && Places.dist[r.d].k.startsWith(k)) ? '' : 'none'; }); };
  },
  country(c, cc) { const rows = Places.inCountry(cc); this.show(c, rows, `<div class="fd-h">${Places.flag(cc)} ${esc(Places.regionName(cc))} · ${rows.length} cities</div>${Places.states(cc).length > 1 ? `<button class="btn ghost wide" data-fd="states" data-cc="${cc}">Browse by region</button>` : ''}`); },
  async online(c, q) {
    this.paint(c, '<p class="muted small">Searching online…</p>');
    try { const r = await Data.search(q); this.list = r.map(p => ({ n: p.name, cc: p.country_code, lat: p.latitude, lon: p.longitude, p: Math.round((p.population || 0) / 1000), a: -1, d: -1, online: p })); this.paint(c, this.list.map((r, i) => `<button class="item fd-r" data-fi="${i}"><span class="fd-f">${Places.flag(r.cc)}</span><div class="grow"><div class="t1">${esc(r.n)}</div><div class="t2">${esc([r.online.admin2, r.online.admin1, r.online.country].filter(Boolean).join(', '))}</div></div></button>`).join('') || '<p class="muted">No match online either.</p>'); }
    catch { this.paint(c, '<p class="muted small">Online search isn\'t reachable right now.</p>'); }
  },
  pick(r) { const p = r.online ? { name: r.n, country: r.online.country, cc: r.cc, region: r.online.admin1 || '', lat: r.lat, lon: r.lon } : Places.place(r); Modal.close(); this.done && this.done(p); },
  me(c) {
    if (!navigator.geolocation) return toast('Location isn\'t available here');
    toast('Finding you…');
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = +pos.coords.latitude.toFixed(3), lon = +pos.coords.longitude.toFixed(3), r = Places.nearest(lat, lon);
      Modal.close(); this.done && this.done(r ? { ...Places.place(r), lat, lon, near: true } : { name: 'My location', country: '', lat, lon });
    }, () => toast(isArtifactHost ? 'Location works once the app runs on your domain' : 'Location permission was declined'), { timeout: 12000, maximumAge: 5 * MIN });
  },
  open(done, title = 'Find a place') {
    this.done = done;
    Modal.open(`<h3 style="margin-bottom:10px">${title}</h3>
      <div class="fd-box">${ic('search')}<input id="fdq" placeholder="Any city, town or village" autocomplete="off" autocapitalize="words" enterkeyhint="search"><button class="fd-x" data-fd="clear" aria-label="Clear">✕</button></div>
      <div class="fd-btns"><button class="btn ghost" data-fd="me">${ic('loc')} Where am I?</button><button class="btn ghost" data-fd="states" data-cc="IN">🇮🇳 Browse India</button></div>
      <div class="list fd-list" id="fdl"></div>
      <div class="small faint mt">${Places.count.toLocaleString()} places built in, so search works even offline. Place names: GeoNames (CC BY 4.0).</div>`, c => {
      const q = $('#fdq', c); let t;
      q.oninput = () => { clearTimeout(t); t = setTimeout(() => this.run(c, q.value), 90); };
      q.onkeydown = e => { if (e.key === 'Enter' && this.list[0]) this.pick(this.list[0]); };
      c.onclick = e => {
        if (!c.querySelector('#fdq')) return;
        const b = e.target.closest('[data-fi],[data-st],[data-cc],[data-fd]'); if (!b) return;
        if (b.dataset.fi != null) return this.pick(this.list[+b.dataset.fi]);
        const fd = b.dataset.fd;
        if (fd === 'me') return this.me(c);
        if (fd === 'clear') { q.value = ''; q.focus(); return this.home(c); }
        if (fd === 'online') return this.online(c, q.value.trim());
        if (fd === 'states') return this.states(c, b.dataset.cc || 'IN');
        if (b.dataset.st != null) return this.state(c, +b.dataset.st);
        if (b.dataset.cc) return this.country(c, b.dataset.cc);
      };
      this.home(c);
      setTimeout(() => q.focus(), 120);
    });
  },
};

/* ---------- quick look: live weather for any place, without saving it ---------- */
const Peek = { l: null };
Sheets.peek = {
  title: () => Peek.l ? `${Places.flag(Peek.l.cc)} ${Peek.l.name}` : 'Weather anywhere',
  render() {
    const l = Peek.l; if (!l) return '<p class="muted">Search for a place first.</p>';
    const d = Data.get(l);
    if (!d) return `<div class="glass center" style="padding:40px">Getting the weather for ${esc(l.name)}…</div>`;
    const c = d.current, [lab] = wInfo(c.weather_code), D = days(d), H = hours(d, null, 24), saved = S.locs.some(x => Math.abs(x.lat - l.lat) < .01 && Math.abs(x.lon - l.lon) < .01);
    return `<div class="glass pk-hero">
        <div class="pk-top"><div><div class="pk-name">${esc(l.name)}</div><div class="small muted">${esc([l.region, l.country].filter(Boolean).join(', '))}${l.near ? ' · near you' : ''}</div><div class="small muted">${fmtTime(Date.now(), d.timezone)} local time</div></div>${wIcon(c.weather_code, c.is_day, 72)}</div>
        <div class="pk-temp">${U.T(c.temperature_2m)}</div>
        <div class="pk-cond">${lab} · Feels like ${U.T(c.apparent_temperature)}</div>
        <div class="small muted">High ${U.T(D[0].temperature_2m_max)} · Low ${U.T(D[0].temperature_2m_min)} · Humidity ${c.relative_humidity_2m}% · Wind ${U.W(c.wind_speed_10m)}</div>
        <div class="pk-line">${esc(smartLine(d, l))}</div>
        ${d.demo ? `<div class="small" style="color:#ffd59a;margin-top:8px">Sample weather: live data turns on once the app runs on your domain.</div>` : `<div class="small faint" style="margin-top:8px"><span class="live on"></span> Live</div>`}
      </div>
      <div class="sec-t">Next 24 hours</div>
      <div class="pk-hours">${H.filter((_, i) => i % 2 === 0).map(h => `<div><span>${fmtHour(h.t, d.timezone)}</span>${wIcon(h.weather_code, h.is_day, 30)}<b>${U.T(h.temperature_2m)}</b><small>${h.precipitation_probability ?? 0}%</small></div>`).join('')}</div>
      <div class="sec-t">Next 7 days</div>
      <div class="list">${D.slice(0, 7).map((x, i) => `<div class="item"><b style="width:56px">${i === 0 ? 'Today' : fmtDay(x.t, d.timezone)}</b>${wIcon(x.weather_code, 1, 32)}<div class="grow small muted">${wInfo(x.weather_code)[0]}${x.precipitation_probability_max ? ` · ${x.precipitation_probability_max}% rain` : ''}</div><b>${U.T(x.temperature_2m_max)}</b><span class="muted">&nbsp;${U.T(x.temperature_2m_min)}</span></div>`).join('')}</div>
      <div class="frow mt2">${saved ? '<div class="small muted center grow">Already in your places ✓</div>' : S.locs.length < 7 ? `<button class="btn pri" data-act="peekSave">${ic('pin')} Save to my places</button>` : '<div class="small muted grow">You have 7 places saved. Remove one to save this.</div>'}<button class="btn ghost" data-act="peekFind">${ic('search')} Another place</button></div>`;
  },
};
const peekAt = p => { Peek.l = { id: 'peek', tag: '', ...p }; delete S.cache.peek; delete S.aq.peek; Router.cur === 'peek' ? Router.render() : Router.go('peek'); Data.load(Peek.l, true).then(() => { if (Router.cur === 'peek') { $('#sheet-title').textContent = Sheets.peek.title(); Router.render(); } }); };
Acts.peekFind = () => Finder.open(peekAt, 'Weather anywhere');
Acts.peekSave = () => {
  const l = Peek.l; if (!l || S.locs.length >= 7) return;
  const n = { ...l, id: uid() }; S.locs.push(n); S.cache[n.id] = S.cache.peek; if (S.aq.peek) S.aq[n.id] = S.aq.peek; save();
  toast(`${l.name} saved. Swipe to it on the home screen.`); Router.render(); App.refresh && App.refresh();
};

</script>
